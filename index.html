<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hideout — Storage & Waitlist Manager</title>
<link id="faviconLink" rel="icon" type="image/png" href="">

<style>
  :root{
    --paper: #F7F3EA;
    --ink: #1C3A4D;
    --deep-water: #123247;
    --dock-wood: #8A6D4B;
    --dock-wood-light: #E7DCC8;
    --line: #D9CFBC;
    --ok: #2E8F4F;
    --ok-bg: #E1F0E5;
    --assigned: #2F6FAD;
    --assigned-bg: #E2EBF4;
    --repair: #D9822B;
    --repair-bg: #F7E9D5;
    --remove: #C0392B;
    --remove-bg: #F6E0DD;
    --paid: #B8960C;
    --paid-bg: #F6F0D9;
    --rust: #A8462B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}

  /* Header */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--deep-water);
    padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap;gap:8px;
  }
  .masthead-brand{display:flex;align-items:center;gap:12px;}
  .org-logo{height:44px;width:auto;display:block;}
  .masthead-text{display:flex;flex-direction:column;}
  .masthead h1{
    font-size:1.5rem;margin:0;font-weight:800;letter-spacing:-0.01em;
  }
  .masthead .sub{font-size:0.82rem;color:var(--dock-wood);font-weight:600;}
  .admin-toggle{
    padding:8px 14px;border-radius:7px;border:2px solid var(--dock-wood);background:#fff;
    color:var(--dock-wood);font-weight:700;font-size:0.8rem;cursor:pointer;white-space:nowrap;
  }
  .admin-toggle.on{background:var(--ok);border-color:var(--ok);color:#fff;}
  .readonly-banner{
    background:var(--dock-wood-light);border:2px solid var(--dock-wood);border-radius:8px;
    padding:9px 14px;font-size:0.82rem;color:var(--ink);margin-bottom:14px;font-weight:600;
  }

  /* Section toggle */
  .section-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .section-btn{
    flex:1;padding:12px 16px;border-radius:9px;border:2px solid var(--deep-water);
    background:#fff;color:var(--deep-water);font-weight:800;font-size:0.95rem;
    cursor:pointer;text-align:center;transition:background .15s,color .15s;
  }
  .section-btn.active{background:var(--deep-water);color:#fff;}
  .section-btn.waitlist-section{border-color:var(--dock-wood);color:var(--dock-wood);}
  .section-btn.waitlist-section.active{background:var(--dock-wood);color:#fff;}
  @media (max-width:480px){
    .section-btn{font-size:0.85rem;padding:10px 8px;}
    .org-logo{height:32px;}
  }

  /* Location tabs */
  .tab-groups{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .tab-group-label{
    font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--dock-wood);margin-bottom:5px;
  }
  .sitemap-link{
    border:none;background:transparent;color:var(--deep-water);font-size:0.82rem;
    cursor:pointer;padding:9px 8px 9px 2px;opacity:0.6;
  }
  .sitemap-link:hover{opacity:1;}
  .tab-wrap.active .sitemap-link{color:#fff;}
  .sitemap-preview{max-width:100%;max-height:60vh;display:block;margin:0 auto 14px;border:1px solid var(--line);border-radius:8px;}
  .sitemap-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .sitemap-upload-row input[type="file"]{font-size:0.82rem;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-wrap{display:flex;align-items:stretch;border-radius:7px;overflow:hidden;border:2px solid var(--deep-water);}
  .tab-wrap.active{background:var(--deep-water);}
  .tab{
    padding:9px 10px 9px 14px;border:none;
    background:transparent;color:var(--deep-water);font-weight:700;font-size:0.88rem;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .tab-wrap.active .tab{color:#fff;}
  .tab .count{font-weight:500;opacity:0.75;margin-left:4px;font-size:0.8em;}
  .rename-btn{
    border:none;background:transparent;color:var(--deep-water);cursor:pointer;
    font-size:0.8rem;padding:9px 10px 9px 2px;opacity:0.6;
  }
  .rename-btn:hover{opacity:1;}
  .tab-wrap.active .rename-btn{color:#fff;}
  .delete-loc-btn{
    border:none;background:transparent;color:var(--remove);cursor:pointer;
    font-size:0.78rem;padding:9px 8px 9px 2px;opacity:0.6;
  }
  .delete-loc-btn:hover{opacity:1;}
  .tab-wrap.active .delete-loc-btn{color:#ffb3a8;}
  .move-btn{
    border:none;background:transparent;color:var(--deep-water);cursor:pointer;
    font-size:0.85rem;font-weight:900;padding:9px 4px;opacity:0.55;
  }
  .move-btn:hover{opacity:1;}
  .move-btn:disabled{opacity:0.2;cursor:default;}
  .tab-wrap.active .move-btn{color:#fff;}
  .add-loc-btn{
    padding:9px 14px;border-radius:7px;border:2px dashed var(--dock-wood);
    background:transparent;color:var(--dock-wood);font-weight:700;font-size:0.88rem;
    cursor:pointer;
  }
  .add-loc-btn:hover{background:var(--dock-wood-light);}
  .add-loc-btn.small-add{padding:7px 12px;font-size:0.8rem;align-self:center;}

  /* Toolbar */
  .toolbar{
    display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;
  }
  .toolbar input[type="text"]{
    flex:1;min-width:160px;padding:9px 12px;border:2px solid var(--line);
    border-radius:7px;font-size:0.92rem;background:#fff;color:var(--ink);
  }
  .toolbar input[type="text"]:focus{outline:2px solid var(--deep-water);outline-offset:1px;border-color:var(--deep-water);}
  .filter-pill{
    padding:8px 12px;border-radius:7px;border:2px solid var(--line);background:#fff;
    font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .filter-pill.active{border-color:var(--deep-water);background:var(--dock-wood-light);}
  .btn{
    padding:9px 14px;border-radius:7px;border:none;font-weight:700;font-size:0.88rem;
    cursor:pointer;background:var(--deep-water);color:#fff;
  }
  .btn:hover{background:#0d2635;}
  .btn.secondary{background:#fff;color:var(--deep-water);border:2px solid var(--deep-water);}
  .btn.secondary:hover{background:var(--dock-wood-light);}
  .btn.undo-btn{border-color:var(--repair);color:var(--repair);}
  .btn.undo-btn:hover{background:var(--repair-bg);}
  .btn.small{padding:6px 10px;font-size:0.78rem;}

  /* Grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;
  }
  .card{
    background:#fff;border:2px solid var(--line);border-radius:9px;padding:12px 13px;
    display:flex;flex-direction:column;gap:6px;
  }
  .card.status-assigned{border-left:5px solid var(--assigned);}
  .card.status-vacant{border-left:5px solid var(--ok);}
  .card.status-repair{border-left:5px solid var(--repair);}
  .card.status-removal{border-left:5px solid var(--remove);}
  .card.status-paid{border-left:5px solid var(--paid);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card-id{font-size:1.05rem;font-weight:800;}
  .badge{
    font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;
  }
  .badge.status-assigned{background:var(--assigned-bg);color:var(--assigned);}
  .badge.status-vacant{background:var(--ok-bg);color:var(--ok);}
  .badge.status-repair{background:var(--repair-bg);color:var(--repair);}
  .badge.status-removal{background:var(--remove-bg);color:var(--remove);}
  .badge.status-paid{background:var(--paid-bg);color:var(--paid);}
  .status-select.status-assigned{color:var(--assigned);border-color:var(--assigned);}
  .status-select.status-vacant{color:var(--ok);border-color:var(--ok);}
  .status-select.status-repair{color:var(--repair);border-color:var(--repair);}
  .status-select.status-removal{color:var(--remove);border-color:var(--remove);}
  .status-select.status-paid{color:var(--paid);border-color:var(--paid);}
  .card-field{font-size:0.82rem;display:flex;justify-content:space-between;gap:6px;}
  .card-field label{color:var(--dock-wood);font-weight:600;}
  .card-field input, .card-field select{
    border:1.5px solid var(--line);border-radius:5px;padding:3px 6px;font-size:0.82rem;
    width:110px;text-align:right;color:var(--ink);
  }
  .status-select{font-weight:700;border-width:1.5px;}
  .card-notes textarea{
    width:100%;border:1.5px solid var(--line);border-radius:5px;padding:5px 7px;
    font-size:0.8rem;font-family:inherit;resize:vertical;min-height:34px;color:var(--ink);
  }
  .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .audited-line{font-size:0.7rem;color:var(--dock-wood);}
  .remove-x{
    background:none;border:none;color:var(--remove);font-size:0.75rem;font-weight:700;
    cursor:pointer;padding:2px 4px;
  }

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--dock-wood);font-size:0.95rem;
  }

  .login-gate{
    text-align:center;padding:70px 20px;max-width:420px;margin:0 auto;
  }
  .login-gate-icon{font-size:2.6rem;margin-bottom:10px;}
  .login-gate h2{margin:0 0 10px;font-size:1.3rem;color:var(--ink);}
  .login-gate p{color:var(--dock-wood);font-size:0.92rem;margin-bottom:20px;line-height:1.5;}

  /* Add form */
  .add-row{
    display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;background:#fff;
    border:2px dashed var(--line);border-radius:9px;padding:10px;
  }
  .add-row input, .add-row select{
    padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:0.85rem;
  }
  .add-row input[name="id"]{width:110px;}
  .add-row input[name="lot"]{width:100px;}

  .status-bar{
    display:flex;gap:14px;font-size:0.78rem;color:var(--dock-wood);margin:10px 2px 2px;flex-wrap:wrap;
  }
  .status-bar strong{color:var(--ink);}

  /* Waitlist */
  .wl-loc-tabs{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px;
    padding-bottom:8px;border-bottom:2px solid var(--line);
  }
  .wl-loc-tab-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .wl-loc-tab-group-label{
    font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--dock-wood);
    margin:0 2px 0 8px;font-weight:700;
  }
  .wl-loc-tab-group:first-child .wl-loc-tab-group-label{margin-left:0;}
  .wl-loc-tab{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:6px 13px;font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--ink);
    white-space:nowrap;
  }
  .wl-loc-tab:hover{border-color:var(--dock-wood);}
  .wl-loc-tab.active{background:var(--dock-wood);border-color:var(--dock-wood);color:#fff;}
  .wl-loc-tab .wl-loc-tab-count{opacity:0.75;font-weight:500;margin-left:3px;}
  .wl-loc-manage-select{
    margin-left:auto;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;
    font-size:0.78rem;background:#fff;
  }
  .wl-list{display:flex;flex-direction:column;gap:8px;}
  .wl-row{
    background:#fff;border:2px solid var(--line);border-radius:9px;padding:10px 14px;
    display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
  }
  .wl-position{
    font-weight:800;font-size:1.1rem;color:var(--dock-wood);min-width:28px;
    padding-top:4px;display:flex;align-items:center;gap:3px;
  }
  .wl-pos-hash{font-size:0.85rem;color:var(--dock-wood);}
  .wl-pos-input{
    width:38px;text-align:center;font-weight:800;font-size:0.95rem;color:var(--dock-wood);
    border:1.5px solid var(--line);border-radius:5px;padding:2px 0;
  }
  .wl-pos-input:focus{outline:2px solid var(--deep-water);outline-offset:1px;border-color:var(--deep-water);}
  .wl-main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px;}
  .wl-name-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .wl-name-row input[type="text"]{
    border:1.5px solid var(--line);border-radius:5px;padding:5px 8px;font-size:0.88rem;color:var(--ink);
  }
  .wl-name-row input[name="wl-name"]{font-weight:700;min-width:130px;}
  .wl-name-row input[name="wl-phone"]{min-width:120px;}
  .wl-name-row input[name="wl-lot"]{min-width:90px;}
  .wl-name-row select{
    border:1.5px solid var(--line);border-radius:5px;padding:5px 8px;font-size:0.85rem;color:var(--ink);
  }
  .wl-notes textarea{
    width:100%;border:1.5px solid var(--line);border-radius:5px;padding:5px 7px;
    font-size:0.8rem;font-family:inherit;resize:vertical;min-height:30px;color:var(--ink);
  }
  .wl-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:140px;}
  .wl-date{font-size:0.7rem;color:var(--dock-wood);display:flex;flex-direction:column;gap:3px;}
  .wl-date input[type="date"]{
    border:1.5px solid var(--line);border-radius:5px;padding:4px 6px;font-size:0.78rem;color:var(--ink);
    font-family:inherit;
  }
  .wl-status-select{font-weight:700;border-width:1.5px;border-radius:5px;padding:5px 8px;font-size:0.82rem;}

  @media (max-width:480px){
    .masthead h1{font-size:1.25rem;}
    .grid{grid-template-columns:1fr 1fr;}
    .add-row input[name="id"], .add-row input[name="lot"]{width:90px;}
  }

  /* In-app dialog (replaces native prompt/confirm/alert, which are blocked in this sandboxed frame) */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,50,71,0.45);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
  }
  .modal-card{
    background:#fff;border-radius:12px;padding:20px 22px;max-width:360px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .modal-message{font-size:0.95rem;color:var(--ink);margin-bottom:12px;line-height:1.4;}
  .modal-card input[type="text"]{
    width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:7px;
    font-size:0.92rem;color:var(--ink);margin-bottom:14px;
  }
  .modal-card input[type="text"]:focus{outline:2px solid var(--deep-water);outline-offset:1px;border-color:var(--deep-water);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .forgot-link{margin:-6px 0 14px;text-align:right;}
  .forgot-link a{color:var(--assigned);font-size:0.78rem;font-weight:600;text-decoration:none;}
  .forgot-link a:hover{text-decoration:underline;}
  .stay-logged-in{display:flex;align-items:center;gap:7px;font-size:0.82rem;color:var(--ink);margin:-4px 0 12px;cursor:pointer;}
  .stay-logged-in input{width:15px;height:15px;accent-color:var(--deep-water);cursor:pointer;}
  .modal-card.wide{max-width:460px;}
  .um-title{font-weight:800;font-size:1.05rem;margin-bottom:12px;color:var(--ink);}
  .um-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:240px;overflow-y:auto;}
  .um-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:0.85rem;
  }
  .um-row .um-role{font-weight:700;font-size:0.72rem;padding:2px 8px;border-radius:20px;}
  .um-row .um-role.owner{background:var(--repair-bg);color:var(--repair);}
  .um-row .um-role.admin{background:var(--assigned-bg);color:var(--assigned);}
  .um-row .um-role.staff{background:var(--ok-bg);color:var(--ok);}
  .um-locked-note{font-size:0.74rem;color:var(--dock-wood);font-style:italic;}
  .um-row button{background:none;border:none;color:var(--remove);font-weight:700;cursor:pointer;font-size:0.8rem;}
  .um-row-actions{display:flex;gap:10px;flex-shrink:0;}
  .um-row-actions button[data-action="um-reset-pw"], .um-row-actions button[data-action="um-set-recovery"]{color:var(--assigned);}
  .um-recovery-set{font-size:0.75rem;}
  .um-hint{font-size:0.74rem;color:var(--dock-wood);margin-bottom:10px;line-height:1.4;}
  .activity-log-list{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .activity-log-row{
    border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-size:0.82rem;
  }
  .activity-log-when{font-size:0.7rem;color:var(--dock-wood);font-weight:700;margin-bottom:2px;}
  .activity-log-who{font-weight:700;color:var(--ink);}
  .activity-log-role{font-weight:500;color:var(--dock-wood);}
  .activity-log-action{color:var(--ink);margin-top:2px;}
  .branding-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .branding-field label{font-size:0.78rem;font-weight:700;color:var(--dock-wood);}
  .branding-field input[type="text"]{
    border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font-size:0.9rem;color:var(--ink);
  }
  .branding-field input[type="color"]{width:60px;height:36px;border:1.5px solid var(--line);border-radius:6px;padding:2px;cursor:pointer;}
  .br-logo-row{display:flex;align-items:center;gap:12px;}
  .br-logo-preview{height:44px;width:auto;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff;}
  .perm-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
  .perm-row{display:flex;align-items:center;gap:9px;font-size:0.86rem;color:var(--ink);cursor:pointer;}
  .perm-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--deep-water);cursor:pointer;}
  .um-add-row{display:flex;gap:6px;flex-wrap:wrap;border-top:1.5px dashed var(--line);padding-top:12px;margin-bottom:6px;}
  .um-add-row input, .um-add-row select{
    border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;font-size:0.82rem;color:var(--ink);
  }
  .um-add-row input[name="um-username"]{flex:1;min-width:100px;}
  .um-add-row input[name="um-password"]{flex:1;min-width:100px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="masthead">
    <div class="masthead-brand">
      <img id="orgLogo" class="org-logo" src="" alt="" style="display:none;">
      <div class="masthead-text">
        <h1 id="appTitleText">Storage & Waitlist Manager</h1>
        <div class="sub" id="appTaglineText">The Hideout · Recreation Dept</div>
      </div>
    </div>
    <div id="adminToggleSlot"></div>
  </div>
  <div id="root"></div>
  <div id="modalRoot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCoKUosgdaCpLL3OK9u0poqCo7eUFzi_bU",
    authDomain: "hideout-storage-tracker.firebaseapp.com",
    projectId: "hideout-storage-tracker",
    storageBucket: "hideout-storage-tracker.firebasestorage.app",
    messagingSenderId: "346169203099",
    appId: "1:346169203099:web:ad26b4dcd3d5aae130693e"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var FIRESTORE_COLLECTION = 'appData';

  // Mimics the same shape Claude's window.storage used, so none of the
  // app code below (which calls window.storage.get/set/delete) needs to change.
  window.storage = {
    get: function(key){
      return db.collection(FIRESTORE_COLLECTION).doc(key).get().then(function(snap){
        if (!snap.exists) { throw new Error('not found: ' + key); }
        return { key: key, value: snap.data().value };
      });
    },
    set: function(key, value){
      return db.collection(FIRESTORE_COLLECTION).doc(key).set({ value: value }).then(function(){
        return { key: key, value: value };
      });
    },
    delete: function(key){
      return db.collection(FIRESTORE_COLLECTION).doc(key).delete().then(function(){
        return { key: key, deleted: true };
      });
    }
  };
</script>

<script>
(function(){
  var DEFAULT_LOCATIONS = [
    { id: 'holiday-park', label: 'Roamingwood Marina Rack', unitLabel: 'Site #', category: 'Non-Power Storage Racks' },
    { id: 'getaway-park', label: 'Getaway Park', unitLabel: 'Site #', category: 'Non-Power Storage Racks' },
    { id: 'dry-dock', label: 'Dry Dock', unitLabel: 'Space #', category: 'Laurel Park Camp Ground' },
    { id: 'laurel-park-campground', label: 'Laurel Park Camp Ground', unitLabel: 'Site #', category: 'Laurel Park Camp Ground' }
  ];
  var LOCATIONS = DEFAULT_LOCATIONS; // replaced with saved config once loaded, if any

  async function loadLocationConfig(){
    try {
      var res = await window.storage.get('location-config', true);
      var parsed = JSON.parse(res.value);
      if (Array.isArray(parsed) && parsed.length){
        LOCATIONS = parsed;
      } else {
        LOCATIONS = DEFAULT_LOCATIONS;
      }
    } catch(e){
      LOCATIONS = DEFAULT_LOCATIONS;
      try { await window.storage.set('location-config', JSON.stringify(LOCATIONS), true); } catch(e2){}
    }
    await migrateLocationCategories();
  }

  // Fills in categories for locations saved before categories existed, and
  // adds any brand-new default locations (like Laurel Park Camp Ground) that
  // weren't part of an older saved config yet.
  var CATEGORY_MOVE_VERSION = 4; // bump this to force a one-time re-categorization/label/removal fix below
  var FORCED_CATEGORY_MOVES = { 'dry-dock': 'Laurel Park Camp Ground' };
  var FORCED_REMOVALS = ['deerfield-lake', 'brooks-lake'];

  async function migrateLocationCategories(){
    var changed = false;
    LOCATIONS.forEach(function(l){
      if (!l.category){
        var def = DEFAULT_LOCATIONS.find(function(d){ return d.id === l.id; });
        l.category = def ? def.category : 'Other';
        changed = true;
      }
    });
    DEFAULT_LOCATIONS.forEach(function(def){
      if (!LOCATIONS.some(function(l){ return l.id === def.id; })){
        LOCATIONS.push(Object.assign({}, def));
        changed = true;
      }
    });

    var storedVersion = 1;
    try {
      var vRes = await window.storage.get('category-move-version', true);
      storedVersion = parseInt(vRes.value, 10) || 1;
    } catch(e){ storedVersion = 1; }
    if (storedVersion < CATEGORY_MOVE_VERSION){
      Object.keys(FORCED_CATEGORY_MOVES).forEach(function(id){
        var loc = LOCATIONS.find(function(l){ return l.id === id; });
        if (loc) loc.category = FORCED_CATEGORY_MOVES[id];
      });
      // One-time fix: any location still labeled "Rack #" from before the
      // wording change gets updated to "Site #" (Dry Dock's "Space #" is untouched).
      LOCATIONS.forEach(function(l){
        if (l.unitLabel === 'Rack #') l.unitLabel = 'Site #';
      });
      // One-time removal: drop these locations (and their saved rack/space
      // data) entirely, if they're still present from earlier setup.
      FORCED_REMOVALS.forEach(function(id){
        var idx = LOCATIONS.findIndex(function(l){ return l.id === id; });
        if (idx > -1){
          LOCATIONS.splice(idx, 1);
          try { window.storage.delete('audit:' + id, true); } catch(e3){}
          try { window.storage.delete('audit-ver:' + id, true); } catch(e4){}
        }
      });
      if (LOCATIONS.length === 0){
        LOCATIONS.push(Object.assign({}, DEFAULT_LOCATIONS[0]));
      }
      changed = true;
      try { await window.storage.set('category-move-version', String(CATEGORY_MOVE_VERSION), true); } catch(e2){}
    }

    if (changed) await saveLocationConfig();
  }

  async function saveLocationConfig(){
    try { await window.storage.set('location-config', JSON.stringify(LOCATIONS), true); } catch(e){}
    logActivity('Updated park/location settings');
  }

  var ACTIVITY_LOG_MAX = 400;

  async function loadActivityLog(){
    try {
      var res = await window.storage.get('activity-log', true);
      var parsed = JSON.parse(res.value);
      state.activityLog = Array.isArray(parsed) ? parsed : [];
    } catch(e){
      state.activityLog = [];
    }
  }

  async function saveActivityLogToStorage(){
    try { await window.storage.set('activity-log', JSON.stringify(state.activityLog), true); } catch(e){}
  }

  // Records one line in the activity log: who (username/role), what
  // (a short description), when, and — for login events — their IP.
  // actorOverride lets login/logout log an entry using the account that was
  // just logged in/out even after state.currentUser has already changed.
  async function logActivity(description, actorOverride, ip){
    var actor = actorOverride || state.currentUser;
    if (!actor) return;
    var entry = {
      time: new Date().toISOString(),
      username: actor.username,
      role: actor.role,
      action: description
    };
    if (ip) entry.ip = ip;
    state.activityLog.unshift(entry);
    if (state.activityLog.length > ACTIVITY_LOG_MAX) state.activityLog = state.activityLog.slice(0, ACTIVITY_LOG_MAX);
    await saveActivityLogToStorage();
  }

  // Asks a public IP-lookup service what IP the request came from. There is
  // no way for a website to see a visitor's IP on its own — this calls
  // ipify.org, a well-known free service made for exactly this purpose.
  async function getVisitorIP(){
    try {
      var res = await fetch('https://api.ipify.org?format=json');
      var data = await res.json();
      return data.ip || 'unknown';
    } catch(e){
      return 'unknown';
    }
  }

  var WAITLIST_STATUSES = { waiting: 'Waiting', contacted: 'Contacted', offered: 'Offered a spot', placed: 'Placed', dropped: 'Drop Down on List', denied: 'Rejected' };
  var waitlistColors = { waiting: '#2F6FAD', contacted: '#7B4FA0', offered: '#B8960C', placed: '#2E8F4F', dropped: '#6B7280', denied: '#C0392B' };

  function seedFor(locId){
    if (locId === 'holiday-park'){
      var out = [];
      for (var i=1;i<=18;i++) out.push(mk(String(i)));     // Large Racks 1–18
      for (var k=1;k<=132;k++) out.push(mk(k+'K'));        // Kayak Racks 1K–132K
      return out;
    }
    if (locId === 'dry-dock'){
      var out2 = [];
      for (var s=1;s<=24;s++) out2.push(mk('S-'+s));
      for (var m=1;m<=65;m++) out2.push(mk('M-'+m));
      for (var l=1;l<=6;l++) out2.push(mk('L-'+l));
      return out2;
    }
    return []; // Any other park (e.g. Getaway Park, or a newly added one) starts empty — add sites as they're mapped
  }

  function slugify(name){
    var base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    if (!base) base = 'location';
    var id = base;
    var n = 2;
    while (LOCATIONS.some(function(l){ return l.id === id; })){
      id = base + '-' + n;
      n++;
    }
    return id;
  }

  function mk(id){
    return { id: id, lot: '', status: 'vacant', notes: '', auditedOn: '', auditedBy: '' };
  }

  var state = {
    section: 'audit', // 'audit' or 'waitlist'
    activeLoc: LOCATIONS[0].id,
    search: '',
    filter: 'all',
    data: {}, // locId -> array of units
    waitlist: [],
    waitlistFilterLoc: 'all',
    modal: null,
    currentUser: null, // { username, role: 'staff'|'admin' }
    isOwner: false,
    isAdmin: false,
    isStaff: false,
    lastRackImportBackup: null, // { locId, label, snapshot } — cleared on undo or reload
    lastWaitlistImportBackup: null, // { label, snapshot } — cleared on undo or reload
    activityLog: [],
    loading: true
  };

  var root = document.getElementById('root');
  var modalRoot = document.getElementById('modalRoot');

  function showPrompt(message, defaultValue, onConfirm, masked, confirmLabel){
    state.modal = { kind: 'prompt', message: message, value: defaultValue || '', onConfirm: onConfirm, masked: !!masked, confirmLabel: confirmLabel };
    renderModal();
  }

  function showConfirm(message, onConfirm){
    state.modal = { kind: 'confirm', message: message, onConfirm: onConfirm };
    renderModal();
  }

  function showAlert(message){
    state.modal = { kind: 'alert', message: message };
    renderModal();
  }

  function closeModal(){
    state.modal = null;
    renderModal();
  }

  function renderModal(){
    if (!state.modal){ modalRoot.innerHTML = ''; return; }
    var m = state.modal;

    if (m.kind === 'manageUsers'){
      renderUserManagerModal();
      return;
    }

    if (m.kind === 'branding'){
      renderBrandingModal();
      return;
    }

    if (m.kind === 'activityLog'){
      renderActivityLogModal();
      return;
    }

    if (m.kind === 'permissions'){
      renderPermissionsModal();
      return;
    }

    if (m.kind === 'secondaryAdminPermissions'){
      renderSecondaryAdminPermissionsModal();
      return;
    }

    if (m.kind === 'sitemap'){
      renderSitemapModal(m.locId);
      return;
    }

    if (m.kind === 'restoreWaitlistLocations'){
      renderRestoreWaitlistLocationsModal();
      return;
    }

    var html = '<div class="modal-overlay"><div class="modal-card">';
    html += '<div class="modal-message">'+escapeHtml(m.message)+'</div>';
    if (m.kind === 'prompt'){
      html += '<input type="'+(m.masked?'password':'text')+'" id="modalInput" value="'+escapeAttr(m.value)+'">';
    }
    if (m.kind === 'login'){
      html += '<input type="text" id="modalUsername" placeholder="Username" value="'+escapeAttr(m.username||'')+'">';
      html += '<input type="password" id="modalPassword" placeholder="Password">';
      html += '<label class="stay-logged-in"><input type="checkbox" id="modalStayLoggedIn" checked> Stay logged in on this device</label>';
      html += '<div class="forgot-link"><a href="#" id="changePasswordLink">Change password</a> · <a href="#" id="forgotPasswordLink">Forgot password?</a></div>';
    }
    html += '<div class="modal-actions">';
    if (m.kind !== 'alert'){
      html += '<button class="btn secondary small" id="modalCancel">Cancel</button>';
    }
    html += '<button class="btn small" id="modalConfirm">'+(m.confirmLabel || (m.kind==='alert'?'OK':(m.kind==='confirm'?'Confirm':(m.kind==='login'?'Log in':'Add'))))+'</button>';
    html += '</div></div></div>';
    modalRoot.innerHTML = html;

    var input = document.getElementById('modalInput');
    if (input){ input.focus(); input.select(); }
    var userField = document.getElementById('modalUsername');
    var passField = document.getElementById('modalPassword');
    if (userField){ userField.focus(); }

    var forgotLink = document.getElementById('forgotPasswordLink');
    if (forgotLink){
      forgotLink.addEventListener('click', function(e){
        e.preventDefault();
        var prefill = userField ? userField.value.trim() : '';
        closeModal();
        startPasswordRecovery(prefill);
      });
    }

    var changePwLink = document.getElementById('changePasswordLink');
    if (changePwLink){
      changePwLink.addEventListener('click', function(e){
        e.preventDefault();
        var prefill = userField ? userField.value.trim() : '';
        closeModal();
        startChangePasswordByCredentials(prefill);
      });
    }

    var cancelBtn = document.getElementById('modalCancel');
    if (cancelBtn){
      cancelBtn.addEventListener('click', function(){
        var cb = m.onCancel;
        closeModal();
        if (cb) cb();
      });
    }

    document.getElementById('modalConfirm').addEventListener('click', function(){
      var value;
      if (m.kind === 'login'){
        var stayEl = document.getElementById('modalStayLoggedIn');
        value = { username: userField ? userField.value.trim() : '', password: passField ? passField.value : '', stayLoggedIn: stayEl ? stayEl.checked : false };
      } else {
        value = input ? input.value.trim() : true;
      }
      var cb = m.onConfirm;
      closeModal();
      if (cb) cb(value);
    });

    if (input){
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ document.getElementById('modalConfirm').click(); }
        if (e.key === 'Escape' && cancelBtn){ cancelBtn.click(); }
      });
    }
    [userField, passField].forEach(function(f){
      if (!f) return;
      f.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ document.getElementById('modalConfirm').click(); }
        if (e.key === 'Escape' && cancelBtn){ cancelBtn.click(); }
      });
    });
  }

  var DEFAULT_BRANDING = {
    orgName: 'The Hideout',
    tagline: 'Recreation Dept',
    appTitle: 'Storage & Waitlist Manager',
    accentColor: '#123247',
    logoDataUri: DEFAULT_LOGO_DATA_URI
  };
  var branding = Object.assign({}, DEFAULT_BRANDING);

  var siteMaps = {}; // categoryName -> data URI

  async function loadSiteMaps(){
    try {
      var res = await window.storage.get('site-maps', true);
      siteMaps = JSON.parse(res.value) || {};
    } catch(e){
      siteMaps = {};
    }
  }

  async function saveSiteMaps(){
    try { await window.storage.set('site-maps', JSON.stringify(siteMaps), true); } catch(e){}
    logActivity('Updated a site map');
  }

  // Downscales/recompresses an uploaded image client-side (via canvas) before
  // storing it as a data URI, since shared storage is text-only with a size cap.
  function compressImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.round(w * scale), ch = Math.round(h * scale);
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showSitemapModal(locId){
    state.modal = { kind: 'sitemap', locId: locId };
    renderModal();
  }

  function renderSitemapModal(locId){
    var loc = LOCATIONS.find(function(l){ return l.id === locId; });
    var locLabel = loc ? loc.label : locId;
    var mapUri = siteMaps[locId];
    var html = '<div class="modal-overlay"><div class="modal-card wide">';
    html += '<div class="um-title">Site map — '+escapeHtml(locLabel)+'</div>';
    if (mapUri){
      html += '<img src="'+mapUri+'" class="sitemap-preview" alt="'+escapeAttr(locLabel)+' site map">';
    } else {
      html += '<div class="um-hint">No site map uploaded yet for this location.</div>';
    }
    if (can('manageLocations')){
      html += '<div class="sitemap-upload-row">';
      html += '<input type="file" id="sitemapFileInput" accept="image/*">';
      if (mapUri){
        html += '<button class="btn secondary small" id="sitemapRemoveBtn">Remove map</button>';
      }
      html += '</div>';
    }
    html += '<div class="modal-actions"><button class="btn secondary small" id="sitemapCloseBtn">Close</button></div>';
    html += '</div></div>';
    modalRoot.innerHTML = html;

    document.getElementById('sitemapCloseBtn').addEventListener('click', function(){ closeModal(); });

    var removeBtn = document.getElementById('sitemapRemoveBtn');
    if (removeBtn){
      removeBtn.addEventListener('click', async function(){
        delete siteMaps[locId];
        await saveSiteMaps();
        showSitemapModal(locId);
      });
    }

    var fileInput = document.getElementById('sitemapFileInput');
    if (fileInput){
      fileInput.addEventListener('change', async function(){
        var file = fileInput.files && fileInput.files[0];

  // One-time fix for accounts saved before the Main/Secondary Admin split existed:
  // back then 'admin' meant full access, so if no Main Admin exists yet, promote
  // the original default admin account (or the first account) so nobody gets locked out.
  async function migrateLegacyAdminRole(){
    var hasOwner = userAccounts.some(function(a){ return a.role === 'owner'; });
    if (hasOwner) return;
    var legacy = userAccounts.find(function(a){ return a.username.toLowerCase() === 'admin'; }) || userAccounts[0];

    legacy.role = 'owner';
    await saveUserAccounts();

  async function tryAutoLogin(){

      var saved = JSON.parse(raw);

      var acct = userAccounts.find(function(a){ return a.username === saved.username; });
      if (acct){
        applyCurrentUser({ username: acct.username, role: acct.role });

  function attemptLogin(creds){
    var match = userAccounts.find(function(a){
      return a.username.toLowerCase() === (creds.username||'').toLowerCase() && a.password === creds.password;
    });
    if (match){
      applyCurrentUser({ username: match.username, role: match.role });
      if (creds.stayLoggedIn) saveSession(match.username);
      renderAdminToggle();
      render();
      getVisitorIP().then(function(ip){
        logActivity('Logged in', { username: match.username, role: match.role }, ip);
      });
    } else if (creds.username || creds.password){
      showAlert('That username or password isn\'t right.');
      getVisitorIP().then(function(ip){
        logActivity('Failed login attempt (username: "'+(creds.username||'')+'")', { username: 'unknown', role: '—' }, ip);
      });
    }
  }

      var acct = userAccounts.find(function(a){ return a.username.toLowerCase() === username.toLowerCase(); });

        showAlert('No account found with that username. Ask an admin for help.');
        return;

      if (!acct.securityQuestion){
        showAlert('"'+acct.username+'" doesn\'t have a recovery question set up. Ask an admin to reset the password from "Manage logins".');
        return;
      }
      showPrompt(acct.securityQuestion, '', function(answer){
        if ((answer||'').trim().toLowerCase() !== (acct.securityAnswer||'').trim().toLowerCase()){
          showAlert('That answer doesn\'t match. Ask an admin to reset your password instead.');
          return;
        }
        showPrompt('Enter a new password:', '', async function(newPass){
          newPass = (newPass||'').trim();
          if (!newPass) return;
          acct.password = newPass;
          await saveUserAccounts();
          showAlert('Password updated — you can log in now with your new password.');
        }, true);
      });
    });
  }

  // Seeds a park's default rack list ONLY the very first time it's ever
  // loaded (i.e. when there's genuinely no saved data for it yet). This
  // deliberately never re-seeds based on a version number, so real,
  // already-imported data can never be silently wiped by a future default
  // layout change.
  async function loadLocation(locId){
    try {
      var res = await window.storage.get('audit:' + locId, true);
      state.data[locId] = JSON.parse(res.value);
    } catch(e){
      var seeded = seedFor(locId);
      state.data[locId] = seeded;
      try { await window.storage.set('audit:' + locId, JSON.stringify(seeded), true); } catch(e2){}
    }
  }

  async function saveLocation(locId){
    try {
      await window.storage.set('audit:' + locId, JSON.stringify(state.data[locId]), true);
      var loc = LOCATIONS.find(function(l){ return l.id === locId; });
      logActivity('Updated sites in "'+(loc ? loc.label : locId)+'"');
    } catch(e){
      console.error('Save failed', e);
    }
  }

  // Parses input like "1-40, 1k-132k, 1p-10p, 55" into a Set of exact,
  // uppercased site IDs. A bare number means a plain/Larger Site; a "k"
  // suffix means Kayak Site; a "p" suffix means Pedal Boat Site.
  function parseSiteRanges(text){
    var ids = new Set();
    (text||'').split(',').forEach(function(part){
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(\d+)\s*([a-zA-Z]?)\s*-\s*(\d+)\s*([a-zA-Z]?)$/);
      if (m){
        var lo = parseInt(m[1],10), hi = parseInt(m[3],10);
        var suffix = (m[2] || m[4] || '').toUpperCase();
        if (lo > hi){ var t=lo; lo=hi; hi=t; }
        for (var n=lo; n<=hi; n++) ids.add(n + suffix);
        return;
      }
      var m2 = part.match(/^(\d+)\s*([a-zA-Z]?)$/);
      if (m2){
        ids.add(parseInt(m2[1],10) + (m2[2]||'').toUpperCase());
      }
    });
    return ids;
  }

  function getVisibleUnits(units){
    return units.filter(function(u){
      var matchesFilter = state.filter==='all' || u.status===state.filter;
      var q = state.search.trim().toLowerCase();
      var matchesSearch = !q || u.id.toLowerCase().indexOf(q)>-1 || (u.lot||'').toLowerCase().indexOf(q)>-1;
      return matchesFilter && matchesSearch;
    });
  }

        if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }

    document.querySelectorAll('[data-action="export"]').forEach(function(btn){
      btn.addEventListener('click', function(){ exportCsv(loc, units); });
    });

    var markAllAuditedBtn = document.querySelector('[data-action="mark-all-audited"]');
    if (markAllAuditedBtn){
      markAllAuditedBtn.addEventListener('click', function(){
        var targets = getVisibleUnits(units);
        if (!targets.length){ showAlert('No spaces match the current filter/search.'); return; }
        showPrompt('Mark all '+targets.length+' matching space(s) as audited. Your initials:', '', async function(initials){
          var today = todayStr();
          targets.forEach(function(u){
            u.auditedOn = today;
            u.auditedBy = initials;
          });
          await saveLocation(loc.id);
          render();
        });
      });
    }

    var markAllAssignedBtn = document.querySelector('[data-action="mark-all-assigned"]');
    if (markAllAssignedBtn){
      markAllAssignedBtn.addEventListener('click', function(){
        var targets = getVisibleUnits(units);
        if (!targets.length){ showAlert('No spaces match the current filter/search.'); return; }
        showConfirm('Mark all '+targets.length+' matching space(s) as Assigned?', async function(){
          targets.forEach(function(u){ u.status = 'assigned'; });
          await saveLocation(loc.id);
          render();
        });
      });
    }

    var deleteAllBtn = document.querySelector('[data-action="delete-all-units"]');
    if (deleteAllBtn){
      deleteAllBtn.addEventListener('click', function(){
        showPrompt('Enter the range of sites to delete. Use a plain number for a Larger Site, "k" for a Kayak Site, or "p" for a Pedal Boat Site — e.g. "1-40" or "1k-132k, 1p-10p". Leave blank to use the current filter/search instead.', '', function(rangeText){
          var targets;
          if (rangeText && rangeText.trim()){
            var wanted = parseSiteRanges(rangeText);
            if (wanted.size === 0){
              showAlert('Couldn\'t read that as a range. Try something like "1-40" or "1k-132k, 1p-10p".');
              return;
            }
            targets = units.filter(function(u){
              return wanted.has(String(u.id).toUpperCase());
            });
          } else {
            targets = getVisibleUnits(units);
          }
          if (!targets.length){ showAlert('Nothing matched.'); return; }
          showConfirm('Delete '+targets.length+' matching site(s) in "'+loc.label+'"? This can\'t be undone.', async function(){
            var targetIds = targets.map(function(u){ return u.id; });
            state.data[loc.id] = units.filter(function(u){ return targetIds.indexOf(u.id) === -1; });
            await saveLocation(loc.id);
            render();
          });
        }, false, 'Delete');
      });
    }

    var importCsvInput = document.getElementById('importCsvInput');
    if (importCsvInput){
      importCsvInput.addEventListener('change', function(){
        var file = importCsvInput.files && importCsvInput.files[0];
        if (!file) return;
        importRackCsv(file, loc);
        importCsvInput.value = '';
      });
    }

    var undoRackImportBtn = document.querySelector('[data-action="undo-rack-import"]');
    if (undoRackImportBtn){
      undoRackImportBtn.addEventListener('click', function(){
        var backup = state.lastRackImportBackup;
        if (!backup) return;
        showConfirm('Undo the last import into "'+backup.label+'"? This restores it to how it was right before that import.', async function(){
          state.data[backup.locId] = backup.snapshot;
          state.lastRackImportBackup = null;
          await saveLocation(backup.locId);
          render();
        });
      });
    }

    document.querySelectorAll('[data-action="add"]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var idInput = document.getElementById('newId');
        var lotInput = document.getElementById('newLot');
        var id = idInput.value.trim();
        if (!id) { idInput.focus(); return; }
        if (units.some(function(u){ return u.id.toLowerCase()===id.toLowerCase(); })){
          showAlert('That number already exists.');
          return;
        }
        var u = mk(id);
        u.lot = lotInput.value.trim();
        units.push(u);
        await saveLocation(loc.id);
        render();
      });
    });

    document.querySelectorAll('.card').forEach(function(cardEl){
      var id = cardEl.getAttribute('data-id');
      var unit = units.find(function(u){ return u.id === id; });
      if (!unit) return;

      cardEl.querySelectorAll('[data-field]').forEach(function(fieldEl){
        var field = fieldEl.getAttribute('data-field');
        var evt = (fieldEl.tagName === 'SELECT') ? 'change' : 'input';
        fieldEl.addEventListener(evt, async function(){
          unit[field] = fieldEl.value;
          await saveLocation(loc.id);
          if (field === 'status'){ render(); }
        });
      });

      var auditBtn = cardEl.querySelector('[data-action="audit"]');
      if (auditBtn){
        auditBtn.addEventListener('click', function(){
          showPrompt('Your initials for this audit:', unit.auditedBy || '', async function(initials){
            unit.auditedOn = todayStr();
            unit.auditedBy = initials;
            await saveLocation(loc.id);
            render();
          });
        });
      }

      var removeBtn = cardEl.querySelector('[data-action="remove"]');
      if (removeBtn){
        removeBtn.addEventListener('click', function(){
          showConfirm('Remove '+id+'? This can\'t be undone.', async function(){
            var idx = units.findIndex(function(u){ return u.id === id; });
            if (idx>-1) units.splice(idx,1);
            await saveLocation(loc.id);
            render();
          });
        });
      }
    });
  }

  function exportCsv(loc, units){
    var rows = [['ID','Lot #','Status','Notes','Audited On','Audited By']];
    units.forEach(function(u){
      rows.push([u.id, u.lot, statusLabel(u.status), u.notes, u.auditedOn, u.auditedBy]);
    });
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell==null?'':cell).replace(/"/g,'""');
        return '"'+s+'"';
      }).join(',');
    }).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = loc.label.replace(/\s+/g,'-').toLowerCase()+'-audit.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Fully removes a location — its racks/spaces, audit history, site map,
  // and waitlist reassignment — and fixes up BOTH the Storage Audit section's
  // active tab (state.activeLoc) and the Waitlist section's active tab
  // (state.waitlistFilterLoc) if either was pointing at the deleted
  // location. Used by the delete-location flow in both sections, so
  // deleting a location from one section can never leave the other section
  // referencing a location that no longer exists.
  async function deleteLocationEverywhere(locId){
    var idx = LOCATIONS.findIndex(function(l){ return l.id === locId; });
    if (idx > -1) LOCATIONS.splice(idx, 1);
    delete state.data[locId];
    var fallbackId = LOCATIONS[0].id;
    state.waitlist.forEach(function(w){
      if (w.locationId === locId) w.locationId = fallbackId;
    });
    await saveLocationConfig();
    await saveWaitlist();
    try { await window.storage.delete('audit:' + locId, true); } catch(e){}
    try { await window.storage.delete('audit-ver:' + locId, true); } catch(e){}
    if (siteMaps[locId]){
      delete siteMaps[locId];
      await saveSiteMaps();
    }
    if (state.activeLoc === locId) state.activeLoc = fallbackId;
    if (state.waitlistFilterLoc === locId) state.waitlistFilterLoc = 'all';
  }

  // Removes a location from the WAITLIST SECTION ONLY — it stops showing up
  // as a pickable location there, and anyone currently on the waitlist for
  // it is reassigned to another (still-visible) location. Storage Audit is
  // completely untouched: the location, its racks/spaces, its audit
  // history, and its site map all stay exactly as they were. This is the
  // opposite of deleteLocationEverywhere on purpose — the two sections'
  // location lists must never be merged. Reversible via
  // showRestoreWaitlistLocationsModal().
  async function hideLocationFromWaitlist(locId){
    var target = LOCATIONS.find(function(l){ return l.id === locId; });
    if (!target) return;
    target.hiddenFromWaitlist = true;
    var fallback = LOCATIONS.find(function(l){ return !l.hiddenFromWaitlist; });
    var fallbackId = fallback ? fallback.id : locId;
    state.waitlist.forEach(function(w){
      if (w.locationId === locId) w.locationId = fallbackId;
    });
    await saveLocationConfig();
    await saveWaitlist();
    if (state.waitlistFilterLoc === locId) state.waitlistFilterLoc = 'all';
  }

  function addNewLocationViaPrompt(){
    return new Promise(function(resolve){
      state.modal = {
        kind: 'prompt',
        message: 'Name of new location:',
        value: '',
        onConfirm: async function(name){
          if (!name){ resolve(null); return; }
          var id = slugify(name);
          var newLoc = { id: id, label: name, unitLabel: 'Site #' };
          LOCATIONS.push(newLoc);
          state.data[id] = [];
          await saveLocationConfig();
          await saveLocation(id);
          resolve(id);
        },
        onCancel: function(){ resolve(null); }
      };
      renderModal();
    });
  }

  // Only locations that haven't been removed from the Waitlist section
  // (see hiddenFromWaitlist) show up here — they stay fully intact over
  // in Storage Audit either way, this just controls what's pickable when
  // adding or reassigning a waitlist entry.
  function renderLocationOptionsGrouped(selectedId){
    var categories = [];
    var byCategory = {};
    LOCATIONS.forEach(function(l){
      if (l.hiddenFromWaitlist && l.id !== selectedId) return;
      var cat = l.category || 'Other';
      if (!byCategory[cat]){ byCategory[cat] = []; categories.push(cat); }
      byCategory[cat].push(l);
    });
    var html = '';
    categories.forEach(function(cat){
      html += '<optgroup label="'+escapeAttr(cat)+'">';
      byCategory[cat].forEach(function(l){
        html += '<option value="'+l.id+'"'+(selectedId===l.id?' selected':'')+'>'+escapeHtml(l.label)+'</option>';
      });
      html += '</optgroup>';
    });
    return html;
  }

  // Renders the waitlist location switcher as a row of tabs (one per park,
  // grouped by category, plus an "All" tab) instead of a dropdown — so
  // switching which park's queue you're looking at is a single click, and
  // each tab shows that park's own count so it reads like separate lists.
  function renderLocationTabs(selectedValue){
    var categories = [];
    var byCategory = {};
    LOCATIONS.forEach(function(l){
      if (l.hiddenFromWaitlist) return;
      var cat = l.category || 'Other';
      if (!byCategory[cat]){ byCategory[cat] = []; categories.push(cat); }
      byCategory[cat].push(l);
    });
    var html = '<div class="wl-loc-tabs">';
    html += '<button type="button" class="wl-loc-tab'+(selectedValue==='all'?' active':'')+'" data-action="wl-loc-tab" data-loc="all">All<span class="wl-loc-tab-count">'+state.waitlist.length+'</span></button>';
    categories.forEach(function(cat){
      var catValue = 'cat:' + cat;
      var catCount = state.waitlist.filter(function(w){
        var wLoc = LOCATIONS.find(function(l){ return l.id === w.locationId; });
        return wLoc && (wLoc.category || 'Other') === cat;
      }).length;
      html += '<span class="wl-loc-tab-group-label">'+escapeHtml(cat)+'</span>';
      html += '<div class="wl-loc-tab-group">';
      html += '<button type="button" class="wl-loc-tab'+(selectedValue===catValue?' active':'')+'" data-action="wl-loc-tab" data-loc="'+escapeAttr(catValue)+'">All'+ '<span class="wl-loc-tab-count">'+catCount+'</span></button>';
      byCategory[cat].forEach(function(l){
        var count = state.waitlist.filter(function(w){ return w.locationId === l.id; }).length;
        html += '<button type="button" class="wl-loc-tab'+(selectedValue===l.id?' active':'')+'" data-action="wl-loc-tab" data-loc="'+l.id+'">'+escapeHtml(l.label)+'<span class="wl-loc-tab-count">'+count+'</span></button>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // Each location/park keeps its OWN waitlist numbering (1, 2, 3… within
  // that location only) — not one shared number across every park. This
  // is the true order within a single location: everyone requesting it,
  // sorted by date added, with "Drop Down on List" pinned to the bottom
  // regardless. Search, the status filter, and the location filter only
  // ever decide which ROWS are shown on screen — they must never affect
  // this ordering, or a person's number would appear to change just
  // because you typed something into the search box.
  function getLocationWaitlistOrder(locationId){
    var group = state.waitlist.filter(function(w){ return w.locationId === locationId; });
    group.sort(function(a,b){
      var aDown = a.status === 'dropped', bDown = b.status === 'dropped';
      if (aDown && !bDown) return 1;
      if (bDown && !aDown) return -1;
      return a.addedAt - b.addedAt;
    });
    return group;
  }

  function getVisibleWaitlist(){
    var visible = state.waitlist.filter(function(w){
      var matchesFilter = state.filter==='all' || w.status===state.filter;
      var matchesLoc;
      if (state.waitlistFilterLoc === 'all'){
        matchesLoc = true;
      } else if (state.waitlistFilterLoc.indexOf('cat:') === 0){
        var filterCat = state.waitlistFilterLoc.slice(4);
        var wLoc = LOCATIONS.find(function(l){ return l.id === w.locationId; });
        matchesLoc = wLoc && (wLoc.category || 'Other') === filterCat;
      } else {
        matchesLoc = w.locationId === state.waitlistFilterLoc;
      }
      var q = state.search.trim().toLowerCase();
      var matchesSearch = !q || w.name.toLowerCase().indexOf(q)>-1 || (w.phone||'').toLowerCase().indexOf(q)>-1 || (w.lot||'').toLowerCase().indexOf(q)>-1;
      return matchesFilter && matchesLoc && matchesSearch;
    });
    // Group by location (in the order locations are defined), and within
    // each location keep that location's own true queue order — so the
    // list reads as consecutive per-park queues, e.g. Getaway Park's
    // 1..N, then Holiday Park's 1..N, rather than one interleaved list.
    var locOrderCache = {};
    visible.sort(function(a,b){
      if (a.locationId !== b.locationId){
        var ai = LOCATIONS.findIndex(function(l){ return l.id === a.locationId; });
        var bi = LOCATIONS.findIndex(function(l){ return l.id === b.locationId; });
        return ai - bi;
      }
      if (!locOrderCache[a.locationId]) locOrderCache[a.locationId] = getLocationWaitlistOrder(a.locationId);
      var order = locOrderCache[a.locationId];
      return order.indexOf(a) - order.indexOf(b);
    });
    return visible;
  }

  // Repositions someone within their OWN location's true queue (never the
  // filtered/searched subset, and never mixed with other locations' queues),
  // so typing a new number always means "this is their real place in THIS
  // park's line," regardless of what's currently filtered or searched.
  async function setWaitlistPosition(id, newPos){
    var entry = state.waitlist.find(function(w){ return w.id === id; });
    if (!entry) return;
    var order = getLocationWaitlistOrder(entry.locationId);
    var idx = order.findIndex(function(w){ return w.id === id; });
    if (idx < 0) return;
    var target = Math.max(1, Math.min(order.length, newPos)) - 1;
    if (target === idx) return;
    var moved = order.splice(idx, 1)[0];
    order.splice(target, 0, moved);
    // Re-sequence addedAt for just this location's group so the typed
    // order sticks, without touching any other location's queue.
    // ("Drop Down on List" status still pins to the bottom regardless.)
    var base = Date.now() - order.length * 1000;
    order.forEach(function(w, i){ w.addedAt = base + i * 1000; });
    await saveWaitlist();
  }

    var truePositions = {};

    html += '<span><strong>'+state.waitlist.filter(function(w){return w.status==='offered';}).length+'</strong> offered a spot</span>';

    if (visible.length === 0){

        html += '<input type="text" name="wl-phone" data-field="phone" value="'+escapeAttr(w.phone)+'" placeholder="Phone"'+dis+'>';
        html += '<input type="text" name="wl-lot" data-field="lot" value="'+escapeAttr(w.lot)+'" placeholder="Lot #"'+dis+'>';
        html += '<select data-field="locationId"'+dis+'>';
        html += renderLocationOptionsGrouped(w.locationId);
        if (can('manageLocations')){

  function attachWaitlistHandlers(){
    document.querySelectorAll('[data-action="wl-filter"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.filter = btn.getAttribute('data-filter');
        render();
      });
    });

    document.querySelectorAll('[data-action="wl-loc-tab"]').forEach(function(tab){
      tab.addEventListener('click', function(){
        state.waitlistFilterLoc = tab.getAttribute('data-loc');
        render();
      });
    });

    var wlLocManage = document.getElementById('wlLocManage');
    if (wlLocManage){
      wlLocManage.addEventListener('change', function(){
        var val = wlLocManage.value;
        wlLocManage.value = '';

        if (val === '__add_location__'){
          addNewLocationViaPrompt().then(function(newId){
            state.waitlistFilterLoc = newId || state.waitlistFilterLoc;
            render();
          });
          return;
        }

        if (val === '__rename_location__'){
          if (state.waitlistFilterLoc === 'all' || state.waitlistFilterLoc.indexOf('cat:') === 0){
            showAlert('Click a specific location\'s tab first (not "All" or a category tab), then choose "Rename current tab\'s location…".');
            return;
          }
          var current = LOCATIONS.find(function(l){ return l.id === state.waitlistFilterLoc; });
          showPrompt('Rename this location:', current.label, async function(newName){
            if (!newName) return;
            current.label = newName;
            await saveLocationConfig();
            render();
          });
          return;
        }

        if (val === '__remove_location__'){
          if (state.waitlistFilterLoc === 'all' || state.waitlistFilterLoc.indexOf('cat:') === 0){
            showAlert('Click a specific location\'s tab first (not "All" or a category tab), then choose "Remove current tab\'s location from Waitlist only…".');
            return;
          }
          var visibleCount = LOCATIONS.filter(function(l){ return !l.hiddenFromWaitlist; }).length;
          if (visibleCount <= 1){
            showAlert('At least one location has to stay pickable in the Waitlist — add another before removing this one.');
            return;
          }
          var target = LOCATIONS.find(function(l){ return l.id === state.waitlistFilterLoc; });
          showConfirm('Remove "'+target.label+'" from the Waitlist section only? It stays exactly as-is in Storage Audit — its racks/spaces and audit history are NOT touched. Anyone on the waitlist for it will be reassigned to another location. You can restore it to the Waitlist later from "↩ Restore a location to Waitlist…".', async function(){
            await hideLocationFromWaitlist(target.id);
            render();
          });
          return;
        }

        if (val === '__restore_location__'){
          showRestoreWaitlistLocationsModal();
          return;
        }
      });
    }

    var wlSearchInput = document.getElementById('wlSearchInput');
    if (wlSearchInput){
      wlSearchInput.addEventListener('input', function(){
        state.search = wlSearchInput.value;
        render();
        var el = document.getElementById('wlSearchInput');
        if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }

    var wlExportBtn = document.querySelector('[data-action="wl-export"]');
    if (wlExportBtn){
      wlExportBtn.addEventListener('click', exportWaitlistCsv);
    }

    var wlImportCsvInput = document.getElementById('wlImportCsvInput');
    if (wlImportCsvInput){
      wlImportCsvInput.addEventListener('change', function(){
        var file = wlImportCsvInput.files && wlImportCsvInput.files[0];
        if (!file) return;
        importWaitlistCsv(file);
        wlImportCsvInput.value = '';
      });
    }

    var undoWaitlistImportBtn = document.querySelector('[data-action="undo-waitlist-import"]');
    if (undoWaitlistImportBtn){
      undoWaitlistImportBtn.addEventListener('click', function(){
        var backup = state.lastWaitlistImportBackup;
        if (!backup) return;
        showConfirm('Undo the last waitlist import? This restores the waitlist to how it was right before that import.', async function(){
          state.waitlist = backup.snapshot;
          state.lastWaitlistImportBackup = null;
          await saveWaitlist();
          render();
        });
      });
    }

    document.querySelectorAll('[data-action="wl-set-position"]').forEach(function(inp){
      inp.addEventListener('change', async function(){
        var id = inp.getAttribute('data-id');
        var newPos = parseInt(inp.value, 10);
        if (!newPos || isNaN(newPos)) return; // leave the box alone; don't snap back mid-edit
        await setWaitlistPosition(id, newPos);
        render();
      });
      inp.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ inp.blur(); }
      });
    });

    var wlNewLocSelect = document.getElementById('wlNewLoc');
    if (wlNewLocSelect){
      wlNewLocSelect.addEventListener('change', async function(){
        if (wlNewLocSelect.value === '__add_location__'){
          var newId = await addNewLocationViaPrompt();
          render(); // re-render rebuilds the select with the new location available
          if (newId){
            var freshSelect = document.getElementById('wlNewLoc');
            if (freshSelect) freshSelect.value = newId;
          }
        }
      });
    }

    var wlAddBtn = document.querySelector('[data-action="wl-add"]');
    if (wlAddBtn){
      wlAddBtn.addEventListener('click', async function(){
        var nameInput = document.getElementById('wlNewName');
        var phoneInput = document.getElementById('wlNewPhone');
        var lotInput = document.getElementById('wlNewLot');
        var locSelect = document.getElementById('wlNewLoc');
        var name = nameInput.value.trim();
        if (!name){ nameInput.focus(); return; }
        var locationId = (locSelect.value === '__add_location__') ? LOCATIONS[0].id : locSelect.value;
        var entry = {
          id: 'wl-' + Date.now() + '-' + Math.floor(Math.random()*1000),
          name: name,
          phone: phoneInput.value.trim(),
          lot: lotInput.value.trim(),
          locationId: locationId,
          notes: '',
          status: 'waiting',
          addedAt: Date.now(),
          dateAdded: todayISO()
        };
        state.waitlist.push(entry);
        await saveWaitlist();
        render();
      });
    }

    document.querySelectorAll('.wl-row').forEach(function(rowEl){
      var id = rowEl.getAttribute('data-id');
      var entry = state.waitlist.find(function(w){ return w.id === id; });
      if (!entry) return;

      rowEl.querySelectorAll('[data-field]').forEach(function(fieldEl){
        var field = fieldEl.getAttribute('data-field');
        if (field === 'locationId'){
          fieldEl.addEventListener('change', async function(){
            if (fieldEl.value === '__add_location__'){
              var newId = await addNewLocationViaPrompt();
              if (newId) entry.locationId = newId;
              await saveWaitlist();
              render();
              return;
            }
            entry.locationId = fieldEl.value;
            await saveWaitlist();
            render();
          });
          return;
        }
        var evt = (fieldEl.tagName === 'SELECT') ? 'change' : 'input';
        fieldEl.addEventListener(evt, async function(){
          entry[field] = fieldEl.value;
          if (field === 'dateAdded' && fieldEl.value){
            entry.addedAt = new Date(fieldEl.value + 'T00:00:00').getTime();
          }
          await saveWaitlist();
          if (field === 'status' || field === 'dateAdded'){ render(); }
        });
      });

      var removeBtn = rowEl.querySelector('[data-action="wl-remove"]');
      if (removeBtn){
        removeBtn.addEventListener('click', async function(){
          var idx = state.waitlist.findIndex(function(w){ return w.id === id; });
          if (idx>-1) state.waitlist.splice(idx,1);
          await saveWaitlist();
          render();
        });
      }
    });
  }

  // Basic CSV parser supporting quoted fields with escaped "" quotes,
  // matching the format our own Export CSV buttons produce.
  function parseCsv(text){
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    text = String(text||'').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    while (i < text.length){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ','){ row.push(field); field=''; i++; continue; }
        if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    rows = rows.filter(function(r){ return !(r.length===1 && r[0]===''); });
    return rows;
  }

  // Reads either a real CSV (as text) or a real Excel file (.xlsx/.xls, as
  // binary via SheetJS) and resolves to the same shape either way: an array
  // of rows, each row an array of plain string cell values.
  // Decodes raw file bytes as text, preferring strict UTF-8. If the bytes
  // aren't valid UTF-8 (a very common issue with CSVs exported from Excel,
  // which often use Windows-1252 instead), falls back to that encoding
  // instead of silently producing garbled/mangled characters.
  function decodeTextSmart(buffer){
    var bytes = new Uint8Array(buffer);
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch(e){
      return new TextDecoder('windows-1252').decode(bytes);
    }
  }

  function readSpreadsheetFile(file){
    return new Promise(function(resolve, reject){
      var name = (file.name || '').toLowerCase();
      var isExcel = name.endsWith('.xlsx') || name.endsWith('.xls') ||
        file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' ||
        file.type === 'application/vnd.ms-excel';

      if (!isExcel){
        var textReader = new FileReader();
        textReader.onerror = function(){ reject(new Error('read failed')); };
        textReader.onload = function(){
          try { resolve(parseCsv(decodeTextSmart(textReader.result))); }
          catch(e){ reject(e); }
        };
        textReader.readAsArrayBuffer(file);
        return;
      }

      if (typeof XLSX === 'undefined'){
        reject(new Error('Excel support failed to load'));
        return;
      }
      var binReader = new FileReader();
      binReader.onerror = function(){ reject(new Error('read failed')); };
      binReader.onload = function(){
        try {
          var data = new Uint8Array(binReader.result);
          var workbook = XLSX.read(data, { type: 'array' });
          var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
          rows = rows.map(function(r){
            return r.map(function(cell){ return (cell === null || cell === undefined) ? '' : String(cell).trim(); });
          }).filter(function(r){ return r.some(function(c){ return c !== ''; }); });
          resolve(rows);
        } catch(e){ reject(e); }
      };
      binReader.readAsArrayBuffer(file);
    });
  }

  function rackStatusKeyFromLabel(label){
    var map = { 'vacant':'vacant', 'assigned':'assigned', 'paid':'paid', 'needs repair':'repair', 'removal':'removal' };
    return map[(label||'').trim().toLowerCase()] || null;
  }

  // Reads a rack/space file (CSV or Excel, matching our own Export CSV
  // columns: ID, Lot #, Status, Notes, Audited On, Audited By) and upserts
  // by ID into this location's list — existing racks get updated, new IDs
  // get added.
  function importRackCsv(file, loc){
    readSpreadsheetFile(file).then(async function(rows){
      if (!rows.length){ showAlert('That file has no rows.'); return; }
      var startIdx = (rows[0][0] && rows[0][0].trim().toLowerCase() === 'id') ? 1 : 0;
      var units = state.data[loc.id] || (state.data[loc.id] = []);
      state.lastRackImportBackup = {
        locId: loc.id,
        label: loc.label,
        snapshot: JSON.parse(JSON.stringify(units))
      };
      var added = 0, updated = 0;
      for (var i = startIdx; i < rows.length; i++){
        var r = rows[i];
        var id = (r[0]||'').trim();
        if (!id) continue;
        var lot = (r[1]||'').trim();
        var statusKey = rackStatusKeyFromLabel(r[2]);
        var notes = (r[3]||'').trim();
        var auditedOn = (r[4]||'').trim();
        var auditedBy = (r[5]||'').trim();
        var existing = units.find(function(u){ return u.id.toLowerCase() === id.toLowerCase(); });
        if (existing){
          existing.lot = lot;
          if (statusKey) existing.status = statusKey;
          existing.notes = notes;
          existing.auditedOn = auditedOn;
          existing.auditedBy = auditedBy;
          updated++;
        } else {
          units.push({ id: id, lot: lot, status: statusKey || 'vacant', notes: notes, auditedOn: auditedOn, auditedBy: auditedBy });
          added++;
        }
      }
      await saveLocation(loc.id);
      render();
      showAlert('Imported: '+added+' added, '+updated+' updated.');
    }).catch(function(e){
      showAlert('Couldn\'t read that file. Make sure it\'s a CSV or Excel file in the same format as Export CSV.');
    });
  }

  function waitlistStatusKeyFromLabel(label){
    var found = 'waiting';
    Object.keys(WAITLIST_STATUSES).forEach(function(k){
      if (WAITLIST_STATUSES[k].toLowerCase() === (label||'').trim().toLowerCase()) found = k;
    });
    return found;
  }

  async function resolveLocationIdByLabelForImport(label){
    label = (label||'').trim();
    if (!label) return LOCATIONS[0].id;
    var existing = LOCATIONS.find(function(l){ return l.label.toLowerCase() === label.toLowerCase(); });
    if (existing) return existing.id;
    var id = slugify(label);
    var newLoc = { id: id, label: label, unitLabel: 'Site #', category: 'Other' };
    LOCATIONS.push(newLoc);
    state.data[id] = [];
    await saveLocationConfig();
    await saveLocation(id);
    return id;
  }

  // Reads a waitlist file (CSV or Excel, matching our own Export CSV
  // columns: Position, Name, Phone, Lot #, Location, Status, Notes, Date
  // Added) and appends each row as a new waitlist entry. A Location name
  // that doesn't exist yet is created automatically (its own new park,
  // category "Other").
  function importWaitlistCsv(file){
    readSpreadsheetFile(file).then(async function(rows){
      if (!rows.length){ showAlert('That file has no rows.'); return; }
      var startIdx = (rows[0][0] && rows[0][0].trim().toLowerCase() === 'position') ? 1 : 0;
      state.lastWaitlistImportBackup = {
        label: 'waitlist',
        snapshot: JSON.parse(JSON.stringify(state.waitlist))
      };
      var addedCount = 0;
      for (var i = startIdx; i < rows.length; i++){
        var r = rows[i];
        var name = (r[1]||'').trim();
        if (!name) continue;
        var phone = (r[2]||'').trim();
        var lot = (r[3]||'').trim();
        var locationId = await resolveLocationIdByLabelForImport(r[4]);
        var statusKey = waitlistStatusKeyFromLabel(r[5]);
        var notes = (r[6]||'').trim();
        var dateAddedRaw = (r[7]||'').trim();
        var dateAdded = dateAddedRaw || todayISO();
        var parsedDate = new Date(dateAdded);
        var addedAt = isNaN(parsedDate.getTime()) ? Date.now() : parsedDate.getTime();
        state.waitlist.push({
          id: 'wl-' + Date.now() + '-' + Math.floor(Math.random()*100000) + '-' + i,
          name: name, phone: phone, lot: lot, locationId: locationId,
          notes: notes, status: statusKey, addedAt: addedAt, dateAdded: dateAdded
        });
        addedCount++;
      }
      await saveWaitlist();
      render();
      showAlert('Imported '+addedCount+' waitlist entr'+(addedCount===1?'y':'ies')+'.');
    }).catch(function(e){
      showAlert('Couldn\'t read that file. Make sure it\'s a CSV or Excel file in the same format as Export CSV.');
    });
  }

  function exportWaitlistCsv(){
    var rows = [['Position','Name','Phone','Lot #','Location','Status','Notes','Date Added']];
    var sorted = state.waitlist.slice().sort(function(a,b){
      var aDown = a.status === 'dropped', bDown = b.status === 'dropped';
      if (aDown && !bDown) return 1;
      if (bDown && !aDown) return -1;
      return a.addedAt - b.addedAt;
    });
    sorted.forEach(function(w, i){
      var locObj = LOCATIONS.find(function(l){ return l.id === w.locationId; });
      rows.push([i+1, w.name, w.phone, w.lot, locObj ? locObj.label : w.locationId, WAITLIST_STATUSES[w.status], w.notes, w.dateAdded]);
    });
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell==null?'':cell).replace(/"/g,'""');
        return '"'+s+'"';
      }).join(',');
    }).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'storage-waitlist.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  init();
})();
</script>
